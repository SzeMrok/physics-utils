[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-utils"
version = "0.1.0"
description = "Simple physics utilities using Pint"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "pint"
]

[tool.pytest.ini_options]
pythonpath = ["src"]